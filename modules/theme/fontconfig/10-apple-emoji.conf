<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<fontconfig>
  <!-- Prefer Apple Color Emoji for emoji family -->
  <alias>
    <family>emoji</family>
    <prefer>
      <family>Apple Color Emoji</family>
      <family>Noto Color Emoji</family>
    </prefer>
  </alias>

  <!-- Add Apple Color Emoji as fallback after text fonts -->
  <alias>
    <family>sans-serif</family>
    <accept>
      <family>Apple Color Emoji</family>
    </accept>
  </alias>

  <alias>
    <family>serif</family>
    <accept>
      <family>Apple Color Emoji</family>
    </accept>
  </alias>

  <alias>
    <family>monospace</family>
    <accept>
      <family>Apple Color Emoji</family>
    </accept>
  </alias>

  <!-- Ensure Apple Color Emoji is selected for emoji characters -->
  <match target="pattern">
    <test name="family">
      <string>Noto Color Emoji</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>Apple Color Emoji</string>
    </edit>
  </match>

  <!-- When Apple Color Emoji is requested directly (e.g. in Apple's CSS),
       prepend a text font so spaces/numbers use proper text metrics -->
  <match target="pattern">
    <test name="family" qual="first">
      <string>Apple Color Emoji</string>
    </test>
    <edit name="family" mode="prepend" binding="strong">
      <string>SF Pro Display</string>
    </edit>
  </match>
</fontconfig>
